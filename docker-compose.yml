services:
  spark:
    build:
      context: .
      dockerfile: ./build/Dockerfile
      args:
        BASE_IMAGE: "${SPARKWORK_BASE_IMAGE:-quay.io/jupyter/all-spark-notebook:00987883e58d}"
    image: sparkwork-local:2026-refresh
    stdin_open: true
    tty: true
    volumes:
      - "./work:/home/jovyan/work"
      - "./scripts:/opt/sparkwork/scripts:ro"
    working_dir: /home/jovyan/work
    command:
      - start-notebook.py
      - --ServerApp.root_dir=/home/jovyan/work
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
